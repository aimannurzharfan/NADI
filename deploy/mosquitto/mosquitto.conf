# Local MQTT broker for NADI_MODE=local. Stands in for Huawei IoTDA on a laptop or the UTM LAN.
# Same topic and JSON as IoTDA: $oc/devices/{device_id}/sys/properties/report
# Every client logs in. passwd is made by scripts/mqtt_users.py from .env (git-ignored):
# the server user plus one user per device ID in MQTT_DEVICE_IDS, so the broker itself is the device allowlist.
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl
persistence false
log_dest stdout
# IoTDA's limit is 4 KB per message; anything bigger is refused and the client disconnected
max_packet_size 4096

listener 1883
# a few boards, the server and the simulator: 50 is plenty, and stops a flood of connections
max_connections 50

# MQTT over TLS on 8883: scripts/mqtt_tls.py writes conf.d/tls.conf and the certificates (both git-ignored)
include_dir /mosquitto/config/conf.d

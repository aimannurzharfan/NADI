#
# NADI IoT network: Huawei S series switch (VRP). Paste in system-view, block by block.
#
# Target: UTM's Huawei switch. Written for the S5700 / S5735 / S6700 class (CLI-managed).
# Web-managed models (some S1700 / S1730S) have no CLI for parts of this: marked "verify on device".
#
# Ports (change to match the cabling):
#   GE0/0/1       trunk up to the AR router         VLANs 10, 30
#   GE0/0/2       Wi-Fi AP (MikroTik or Cisco)      VLAN 30 tagged = the "NADI-IoT" SSID
#   GE0/0/3       NADI server / demo laptop         VLAN 10 access
#   GE0/0/4-0/0/8 spare wired IoT ports             VLAN 30 access
#
# The ESP32s are Wi-Fi only, so they reach VLAN 30 through the AP: the AP maps its IoT SSID
# to VLAN 30 and sends it tagged on GE0/0/2. (UTM's Huawei kit has no AP; see the README.)
#

sysname NADI-SW

#
# 1. VLANs
#
vlan batch 10 30
vlan 10
 description NADI servers
vlan 30
 description NADI IoT sensors
#

#
# 2. Uplink to the router: carries both VLANs tagged. Remove VLAN 1 so nothing untagged leaks.
#
interface GigabitEthernet0/0/1
 description uplink to NADI-AR
 port link-type trunk
 port trunk allow-pass vlan 10 30
 undo port trunk allow-pass vlan 1
#

#
# 3. Wi-Fi AP port: IoT SSID tagged as VLAN 30. Only VLAN 30 is allowed, so the AP can't put
#    sensors anywhere else even if it is misconfigured.
#    verify on device: if the AP is managed on its own management VLAN, add that VLAN here too.
#
interface GigabitEthernet0/0/2
 description Wi-Fi AP, NADI-IoT SSID
 port link-type trunk
 port trunk allow-pass vlan 30
 undo port trunk allow-pass vlan 1
#

#
# 4. Server port and spare wired IoT ports (access = untagged, one VLAN each).
#    stp edge-port: end devices, start forwarding at once instead of waiting for STP.
#
interface GigabitEthernet0/0/3
 description NADI server
 port link-type access
 port default vlan 10
 stp edged-port enable
#
port-group nadi-iot-wired
 group-member GigabitEthernet0/0/4 to GigabitEthernet0/0/8
 port link-type access
 port default vlan 30
 stp edged-port enable
 # Sensors on these ports can't talk to each other, only to the gateway
 port-isolate enable group 1
#

#
# 5. Fallback ACL on the switch, only if the router refuses "traffic-filter" on its sub-interface.
#    Same rules as router ACL 3030, applied to everything entering VLAN 30.
#    verify on device: "traffic-filter vlan" is supported on S5700-class and up, not on web-managed models.
#
# acl number 3030
#  rule 5 permit udp source-port eq bootpc destination-port eq bootps
#  rule 10 permit udp destination 192.168.30.1 0 destination-port eq dns
#  rule 15 permit tcp destination 192.168.10.10 0 destination-port eq 1883
#  rule 20 permit tcp destination-port eq 8883
#  rule 25 permit udp destination-port eq ntp
#  rule 30 permit icmp destination 192.168.30.1 0
#  rule 100 deny ip
# traffic-filter vlan 30 inbound acl 3030
#

#
# 6. DHCP snooping: only the router (via the uplink) may hand out addresses in VLAN 30.
#    Stops a rogue DHCP server, e.g. a misconfigured board or phone hotspot bridged in, from
#    redirecting the sensors. verify on device: syntax differs slightly on older VRP.
#
dhcp enable
dhcp snooping enable
vlan 30
 dhcp snooping enable
interface GigabitEthernet0/0/1
 dhcp snooping trusted
#

#
# 7. Management hygiene (same as the router): SSH only. verify on device: needs an SSH user first.
#
undo telnet server enable
stelnet server enable
#

return
#
# After pasting: "save", then check
#   display vlan                         ports in VLANs 10 and 30
#   display port vlan                    trunk/access per port
#   display dhcp snooping user-bind all  sensors that got a lease through the trusted port
#   display port-isolate group 1
#

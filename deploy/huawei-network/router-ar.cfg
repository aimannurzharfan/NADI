#
# NADI IoT network: Huawei AR router (VRP). Paste in system-view, block by block.
#
# Target: UTM's Huawei router. Written for the AR series (AR1200 / AR2200 / AR6000 class).
# Anything marked "verify on device" depends on the exact model or VRP version:
# check it with "display version" and the "?" help before pasting.
#
# Address plan (change to fit the lab):
#   VLAN 10  servers   192.168.10.0/24  gateway .1   NADI server + Mosquitto at 192.168.10.10
#   VLAN 30  IoT       192.168.30.0/24  gateway .1   ESP32 sensors only
#   GE0/0/0  WAN / uplink to the campus network (DHCP from upstream)
#   GE0/0/1  trunk to the Huawei switch (VLANs 10 and 30)
#
# Security idea: the ESP32s live in their own VLAN. The router lets them do exactly three things:
# get an address (DHCP), resolve names (DNS, huawei mode only) and talk MQTT to the broker.
# Everything else from the IoT VLAN is dropped, so a hijacked sensor can't reach staff PCs or the server's other ports.
#

sysname NADI-AR

#
# 1. DHCP for the IoT VLAN (and the server VLAN).
#    Sensors get 192.168.30.10-.250; .2-.9 are kept free for fixed devices.
#
dhcp enable
#
ip pool nadi-iot
 gateway-list 192.168.30.1
 network 192.168.30.0 mask 255.255.255.0
 excluded-ip-address 192.168.30.2 192.168.30.9
 # The router itself answers DNS (see block 4), so sensors only ever talk to .1 for DNS
 dns-list 192.168.30.1
 # 1 day: boards that move or reflash get a new lease quickly
 lease day 1 hour 0 minute 0
#
ip pool nadi-servers
 gateway-list 192.168.10.1
 network 192.168.10.0 mask 255.255.255.0
 # NADI server is static at .10; keep .2-.19 out of the pool
 excluded-ip-address 192.168.10.2 192.168.10.19
 dns-list 192.168.10.1
#

#
# 2. Layer 3 sub-interfaces on the trunk to the switch, one per VLAN (802.1Q termination).
#    "arp broadcast enable" is needed on AR sub-interfaces for normal ARP/DHCP. verify on device:
#    some AR models with built-in switch ports use "interface Vlanif30" instead of sub-interfaces.
#
interface GigabitEthernet0/0/1.10
 description NADI servers VLAN 10
 dot1q termination vid 10
 ip address 192.168.10.1 255.255.255.0
 arp broadcast enable
 dhcp select global
#
interface GigabitEthernet0/0/1.30
 description NADI IoT sensors VLAN 30
 dot1q termination vid 30
 ip address 192.168.30.1 255.255.255.0
 arp broadcast enable
 dhcp select global
#

#
# 3. ACL 3030: what an IoT sensor may send. Applied INBOUND on the IoT sub-interface,
#    so it filters every packet a sensor sends into the router. Replies coming back to the
#    sensors are not affected. Rules are checked in order; the last rule drops the rest.
#
acl number 3030
 description NADI IoT VLAN: DHCP, DNS, MQTT only
 # DHCP: a new board asks for an address (sent from 0.0.0.0 to broadcast, so no address match)
 rule 5 permit udp source-port eq bootpc destination-port eq bootps
 # DNS to the router only (huawei mode: the receiver resolves the IoTDA host name)
 rule 10 permit udp destination 192.168.30.1 0 destination-port eq dns
 # Local mode: MQTT to the Mosquitto broker on the NADI server, port 1883 only
 rule 15 permit tcp destination 192.168.10.10 0 destination-port eq 1883
 # Huawei mode: MQTTS to IoTDA, port 8883 only. Destination is "any" because the IoTDA address
 # can change. To tighten: nslookup the IOTDA_HOST and replace with "destination <ip> 0".
 rule 20 permit tcp destination-port eq 8883
 # NTP: TLS to IoTDA needs a correct clock on the ESP32 (huawei mode). Remove in local-only setups.
 rule 25 permit udp destination-port eq ntp
 # Ping the gateway only, for "is the board on the network" checks
 rule 30 permit icmp destination 192.168.30.1 0
 # Everything else from a sensor: dropped (staff PCs, server SSH/DB ports, the internet)
 rule 100 deny ip
#
interface GigabitEthernet0/0/1.30
 # verify on device: traffic-filter on sub-interfaces is supported on most AR models;
 # if rejected, apply the same ACL on the switch (see switch-s.cfg, block 5) instead.
 traffic-filter inbound acl 3030
#

#
# 4. DNS proxy so sensors can resolve the IoTDA host via the router (huawei mode).
#    verify on device: command names differ across VRP versions ("dns proxy enable" vs "dns server").
#
dns resolve
dns proxy enable
#

#
# 5. Internet access, huawei mode only: NAT the IoT and server VLANs out of the WAN port so the
#    receiver can reach IoTDA and the server can reach the other Huawei Cloud services.
#    Local mode does not need this block; skip it to keep the sensors fully offline.
#
interface GigabitEthernet0/0/0
 description WAN uplink
 ip address dhcp-alloc
#
acl number 2000
 description NADI VLANs allowed out to the internet
 rule 5 permit source 192.168.10.0 0.0.0.255
 rule 10 permit source 192.168.30.0 0.0.0.255
#
interface GigabitEthernet0/0/0
 nat outbound 2000
#

#
# 6. Management hygiene: SSH only, no Telnet. verify on device: needs a local user with
#    "service-type ssh" and an RSA key ("rsa local-key-pair create"); set those up before
#    disabling Telnet so you don't lock yourself out.
#
undo telnet server enable
stelnet server enable
#

return
#
# After pasting: "save", then check
#   display ip pool name nadi-iot used        sensors that got an address
#   display acl 3030                          hit counters per rule ("matched N times")
#   display interface GigabitEthernet0/0/1.30
#
